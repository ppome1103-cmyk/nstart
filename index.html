<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffd6e7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>둘이랜드</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <canvas id="fx"></canvas>

    <!-- 로비 -->
    <div id="lobby" class="screen">
      <div class="card">
        <h1>둘이랜드 🎡</h1>
        <p class="sub">둘이서만 노는 놀이공원</p>

        <label class="field">
          <span>내 이름</span>
          <input id="name" maxlength="8" placeholder="이름" autocomplete="off" />
        </label>

        <div class="field">
          <span>내 색깔</span>
          <div id="colors" class="colors"></div>
        </div>

        <button id="btn-host" class="btn primary">방 만들기</button>

        <div class="join-row">
          <input id="code" maxlength="4" placeholder="방 코드" autocomplete="off" />
          <button id="btn-join" class="btn">참가</button>
        </div>

        <button id="btn-solo" class="btn ghost">혼자 둘러보기</button>
        <button id="btn-diag" class="btn ghost hidden">🔧 연결 진단</button>
        <p id="lobby-msg" class="msg"></p>
      </div>
    </div>

    <div id="loading" class="screen hidden"><div class="card"><h1>🎡</h1><p class="sub">놀이공원 여는 중...</p></div></div>

    <!-- 게임 HUD -->
    <div id="hud" class="hidden"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
